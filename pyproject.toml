[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdo-lobby-manager"
version = "2.0.0a0"
description = "Manage Red Dead Redemption 2 private lobby configurations by editing the game's startup.meta file"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Billy", email = "you@example.com"},
]
keywords = ["rdr2", "red-dead-redemption-2", "lobby", "mod", "tool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

dependencies = [
    "customtkinter>=5.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
net = [
    "zeroconf>=0.130.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
rdo-lobby-manager = "rdo_lobby_manager.__main__:main"

[project.urls]
Homepage = "https://freethought.me"
Repository = "https://github.com/R0U5/RDO-Lobby-Manager"
Issues = "https://github.com/R0U5/RDO-Lobby-Manager/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdo_lobby_manager = ["py.typed"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented-out code)
    "PL",  # pylint
]
ignore = [
    "PLR0913",  # too many arguments (we use dataclasses with many fields)
    "PLR2004",  # magic value (we use them for protocol constants)
    "S101",     # assert (we use asserts in tests)
    "S324",     # weak hash (we'll use this where appropriate)
    "E501",     # line too long (we have a 100-char limit set)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "S106", "S311", "PLC0415", "S105", "SIM102"]
"scripts/**/*.py" = ["S101", "PLR2004", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=rdo_lobby_manager",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=85",
]
markers = [
    "unit: pure unit tests (no I/O)",
    "integration: tests that touch the filesystem",
    "slow: tests that take more than 1 second",
]

# --- MyPy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
